  <head>
    <script>
      (function() {
        try {
          var _currentFetch = window.fetch;
          var getFetch = function() { return _currentFetch; };
          var setFetch = function(fn) { _currentFetch = fn; };

          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: getFetch,
              set: setFetch
            });
          } catch (_) {}

          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: getFetch,
                set: setFetch
              });
            }
          } catch (_) {}
        } catch (e) {
          // ignore
        }
      })();
    </script>
